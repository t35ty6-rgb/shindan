<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>あなた専用レポート｜tsutawaru</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=Yusei+Magic&display=swap" rel="stylesheet">
<style>
:root{--s:1}
*{box-sizing:border-box}
body{margin:0;background:#f3f5f8;color:#1b2440;font-family:'Noto Sans JP',sans-serif}
.ui{max-width:794px;margin:0 auto;padding:28px 16px 8px}
.ui h1{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:26px;line-height:1.35;margin:0 0 6px}
.ui p{margin:0 0 12px;font-size:14px;line-height:1.8;color:#3d4556}
.eyebrow{font-family:'Outfit',sans-serif;font-weight:700;font-size:11px;letter-spacing:.24em;color:#5b6476;margin-bottom:8px}
form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border:1px solid #dde1e8;padding:14px;margin:12px 0}
select,input{font:inherit;font-size:15px;padding:10px;border:1px solid #c9ced8;background:#fff;color:#1b2440;border-radius:6px}
input{flex:1 1 160px;min-width:0}
.btn{display:inline-block;font:inherit;font-weight:900;font-size:15px;padding:12px 20px;border:0;border-radius:999px;cursor:pointer;text-decoration:none;text-align:center}
.btn.main{background:#2f6fd6;color:#fff}.btn.pink{background:#e8417a;color:#fff}.btn.ghost{background:#fff;color:#1b2440;border:1.5px solid #1b2440}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #9cc0f5;outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 18px}
[hidden]{display:none!important}
.pt{flex-basis:100%;display:flex;flex-direction:column;gap:6px;margin-top:6px;font-size:14px}
.prow{display:flex;flex-wrap:wrap;gap:6px}.prow input{flex:1 1 120px}.prow select{font-size:14px;padding:8px}
.note{font-size:12px!important;color:#5b6476!important}
#pages{display:flex;flex-direction:column;align-items:center;gap:16px;padding:8px 16px 48px}
.sheet{width:calc(794px * var(--s));height:calc(1123px * var(--s));overflow:hidden;box-shadow:0 4px 20px rgba(27,36,64,.12);background:#fff;flex:none}
.pg{width:794px;height:1123px;transform:scale(var(--s));transform-origin:0 0;background:#fff;color:#1b2440;font-family:'Noto Sans JP',sans-serif;position:relative}
.pg img{display:block}
.lock{position:relative;height:calc(1123px * var(--s) * .52)!important;box-shadow:none!important}
.lock::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(243,245,248,0) 15%,#f3f5f8 92%)}
.pw{width:100%;max-width:794px;margin:-8px auto 0;background:#fff;border:2px solid #e8417a;border-radius:20px;padding:26px 20px 24px;text-align:center;box-shadow:0 10px 30px rgba(232,65,122,.12)}
.pw .tag{display:inline-block;background:#e8417a;color:#fff;font-weight:900;font-size:13px;padding:4px 14px;border-radius:999px;margin-bottom:10px}
.pw h2{font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:clamp(21px,5vw,28px);line-height:1.4;margin:0 0 6px}
.pw h2 b{color:#e8417a}
.pw .lead{font-size:14px;line-height:1.8;color:#3d4556;margin:0 0 16px}
.thumbs{display:flex;justify-content:center;gap:10px;margin:0 0 18px;--s:.2}
.thumbs .th{position:relative;border-radius:6px;overflow:hidden;flex:none}
.thumbs .th .sheet{filter:blur(2.5px);box-shadow:none}
.thumbs .th span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(27,36,64,.82);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pw ol{list-style:none;margin:0 auto 20px;padding:0;max-width:520px;text-align:left;display:grid;gap:0;border-top:1px solid #eef0f4}
.pw li{display:flex;gap:10px;align-items:baseline;padding:9px 4px;border-bottom:1px solid #eef0f4;font-size:14px}
.pw li i{font-style:normal;font-weight:900;color:#2e9c9a;font-size:12px;min-width:2.4em}
.pw li small{color:#7a8292;font-size:12px;margin-left:auto;text-align:right}
.pw li.hl{background:#fff4f8}
.pw .big{display:block;width:100%;max-width:520px;margin:0 auto;font-size:18px;padding:17px 20px;box-shadow:0 6px 16px rgba(232,65,122,.3)}
.pw .big small{display:block;font-size:12px;font-weight:700;opacity:.92;margin-top:2px}
.pw .pts{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin:12px 0 0;font-size:12.5px;color:#3d4556}
.pw .pts span::before{content:"✓ ";color:#2e9c9a;font-weight:900}
.pw .law{margin-top:12px;font-size:11.5px}.pw .law a{color:#7a8292}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.97);border-top:1px solid #e4e7ee;box-shadow:0 -4px 16px rgba(27,36,64,.08);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:12px;transform:translateY(110%);transition:transform .25s}
#bar.on{transform:none}
body:has(#bar){padding-bottom:84px}
#bar p{margin:0;font-size:13px;font-weight:700;line-height:1.4}#bar p small{display:block;font-weight:400;color:#5b6476;font-size:11.5px}
#bar .btn{padding:11px 18px;font-size:14px;white-space:nowrap}
@media (max-width:560px){.thumbs{--s:.12;gap:8px}.thumbs .th span{font-size:9.5px;padding:2px 6px}.pw{padding:22px 14px}.pw li small{display:none}}
@media (prefers-reduced-motion:reduce){#bar{transition:none}}
@page{size:794px 1123px;margin:0}
@media print{
 :root{--s:1!important}
 #bar,.pw{display:none!important}
 body{background:#fff}
 .ui,.noprint{display:none!important}
 #pages{padding:0;gap:0;display:block}
 .sheet{box-shadow:none;break-after:page;page-break-after:always}
 .pg{transform:none}
}
</style>
</head>
<body>
<div class="ui" id="ui"></div>
<div id="pages"></div>
<script src="calc.js"></script>
<script src="data.js"></script>
<script src="data2.js"></script>
<script src="app.js"></script>
<script>
const BUY_URL='https://buy.stripe.com/7sY3cv0kE83IeBk7cgbjW0i';
const q=new URLSearchParams(location.search);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
if(/^cs_/.test(q.get('sid')||''))store.set('tw_paid',q.get('sid'));
const paid=!!store.get('tw_paid');
const ui=document.getElementById('ui'),pages=document.getElementById('pages');
function fit(){document.documentElement.style.setProperty('--s',Math.min(1,(innerWidth-32)/794))}
addEventListener('resize',fit);fit();
function render(Y,M,D,name,lockAfter,partners){
 const out=buildReport(Y,M,D,name,partners);if(!out){alert('1900年2月5日以降の日付を選んでください。');return false}
 pages.innerHTML=out.html;
 if(lockAfter){[...pages.children].forEach((s,i)=>{if(i>=lockAfter)s.remove();else if(i===lockAfter-1)s.classList.add('lock')})}
 return true;
}
function dateForm(){
 const prev=(store.get('tw_birth')||'1990-01-23').split('-').map(Number);
 ui.innerHTML=`<div class="eyebrow">YOUR PERSONAL ISSUE</div>
 <h1>あなた専用レポートを作ります</h1>
 <p>ご購入ありがとうございます。生年月日を選んで「作る」を押すと、あなただけのレポート（16〜19ページ）が下に出ます。</p>
 <form id="f"><select id="y" aria-label="年"></select><select id="m" aria-label="月"></select><select id="d" aria-label="日"></select><input id="nm" placeholder="お名前（表紙に入ります・任意）" maxlength="20" value="${esc(store.get('tw_name')||'')}">
 <div class="pt"><b>伝え方を知りたい相手（3人まで・任意）</b><span class="note">家族・上司・パートナーなど。1人につき1ページ「その人への伝え方」が入ります。</span>${[0,1,2].map(i=>`<div class="prow"><input id="pn${i}" placeholder="呼び名" maxlength="12"><select id="pr${i}" aria-label="関係">${REL.map(x=>`<option>${x}</option>`).join('')}</select><select id="py${i}" aria-label="年"><option value="">年</option></select><select id="pm${i}" aria-label="月"><option value="">月</option></select><select id="pd${i}" aria-label="日"><option value="">日</option></select></div>`).join('')}</div>
 <button class="btn main" type="submit">作る</button></form>
 <div class="row noprint" id="after" hidden><button class="btn pink" id="pdf" type="button">PDFで保存する</button><a class="btn main" id="paidline" href="#" target="_blank" rel="noopener" style="background:#06C755">LINEに「購入済み」を送る</a></div>
 <p class="note noprint" id="paidnote" hidden>「購入済み」を送ると、LINEの購入案内が届かなくなります。</p>
 <div class="row noprint" id="ext" hidden><a class="btn ghost" id="extbtn" href="#">Safariで開く（PDF保存が確実です）</a></div>
 <p class="note">スマホは「PDFで保存する」→ 共有 →「ファイルに保存」で保存できます。大切な人の分も、生年月日を変えて何度でも作れます。</p>`;
 const G=i=>document.getElementById(i);const yS=G('y'),mS=G('m'),dS=G('d'),f=G('f'),nm=G('nm'),after=G('after'),pdf=G('pdf');
 for(let i=new Date().getFullYear();i>=1900;i--)yS.add(new Option(i+'年',i));
 for(let i=1;i<=12;i++)mS.add(new Option(i+'月',i));
 const fill=()=>{const k=+dS.value||prev[2];const n=new Date(+yS.value,+mS.value,0).getDate();dS.innerHTML='';for(let i=1;i<=n;i++)dS.add(new Option(i+'日',i));dS.value=Math.min(k,n)};
 yS.value=prev[0];mS.value=prev[1];fill();dS.value=prev[2];
 yS.onchange=fill;mS.onchange=fill;
 for(let i=0;i<3;i++){const py=G('py'+i),pm=G('pm'+i),pd=G('pd'+i);for(let y=new Date().getFullYear();y>=1900;y--)py.add(new Option(y+'年',y));for(let m=1;m<=12;m++)pm.add(new Option(m+'月',m));for(let d=1;d<=31;d++)pd.add(new Option(d+'日',d));}
 f.onsubmit=e=>{e.preventDefault();
  const Y=+yS.value,M=+mS.value,D=+dS.value,N=nm.value;
  store.set('tw_birth',`${Y}-${M}-${D}`);store.set('tw_name',N);
  const ps=[0,1,2].map(i=>({name:G('pn'+i).value,rel:G('pr'+i).value,y:+G('py'+i).value,m:+G('pm'+i).value,d:+G('pd'+i).value})).filter(p=>p.y&&p.m&&p.d&&new Date(p.y,p.m,0).getDate()>=p.d);
  if(render(Y,M,D,N,0,ps)){after.hidden=false;G('paidnote').hidden=false;pages.scrollIntoView({behavior:'smooth'})}};
 pdf.onclick=()=>print();
 if(/Line\//.test(navigator.userAgent)){const u=new URL(location.href);u.searchParams.set('openExternalBrowser','1');G('extbtn').href=u.toString();G('ext').hidden=false}
 G('paidline').href='https://line.me/R/oaMessage/'+encodeURIComponent('@594tlzba')+'/?'+encodeURIComponent('【購入済み】レポートを作りました');
}
function paywall(out,shown,label){
 const rest=out.plan.filter((p,i)=>!shown.includes(i)&&p.key!=='cover'&&p.key!=='contents');
 const th=[...rest.slice(0,3)].map(p=>`<div class="th">${out.pages[p.no-1]}<span>購入すると読めます</span></div>`).join('');
 const li=rest.map(p=>`<li><i>P${String(p.no).padStart(2,'0')}</i><span>${p.t}</span><small>${p.s||''}</small></li>`);
 const at=rest.findIndex(p=>p.key==='manual');
 if(!out.r.partners.length)li.splice(at,0,'<li class="hl"><i>＋</i><span><b>大切な人への伝え方</b>（3人まで）</span><small>1人1ページ</small></li>');
 return `<div class="pw noprint" id="pw"><div class="tag">${label}</div>
 <h2>続きは、<b>あなたの生年月日</b>で<br>あと${rest.length}ページ以上</h2>
 <p class="lead">ここから先は購入した方だけが読めます。<br>夫・上司・子どもなど、大切な人への伝え方も入ります。</p>
 <div class="thumbs">${th}</div>
 <ol>${li.join('')}</ol>
 <a class="btn pink big" href="${BUY_URL}">980円で続きを読む<small>お支払い後すぐ、あなた専用で作成</small></a>
 <div class="pts"><span>その場でPDF保存</span><span>大切な人3人まで</span><span>何度でも作り直せる</span></div>
 <div class="law"><a href="./law.html">特定商取引法に基づく表記</a></div></div>`;
}
function stickyBar(){
 if(document.getElementById('bar'))return;
 const b=document.createElement('div');b.id='bar';b.className='noprint';
 b.innerHTML=`<p>続きはあなた専用で<small>980円（税込）・すぐ読めます</small></p><a class="btn pink" href="${BUY_URL}">続きを読む</a>`;
 document.body.appendChild(b);
 const pw=document.getElementById('pw');let pwIn=false;
 if(pw&&'IntersectionObserver' in window)new IntersectionObserver(es=>{pwIn=es[0].isIntersecting;upd()}).observe(pw);
 const upd=()=>b.classList.toggle('on',scrollY>320&&!pwIn);
 addEventListener('scroll',upd,{passive:true});upd();
}
function salesView(){
 ui.innerHTML=`<div class="eyebrow">TSUTAWARU PERSONAL ISSUE</div>
 <h1>「なんで伝わらないの？」を、<br>今日で終わりに。</h1>
 <p>夫、上司、子ども。大切な人の生年月日を入れると、<b>その人に伝わる言い方</b>が1人1ページで分かります。そのまま送れる文例30本、あなたの12タイプ解説、まわりに渡せる「わたしの取扱説明書」つき。</p>
 <div class="row"><a class="btn pink" href="${BUY_URL}">980円で大切な人への伝え方を見る</a></div>
 <p class="note">下は見本（1990年1月23日生まれ）です。最初の数ページを読めます。</p>`;
 const out=buildReport(1990,1,23,'');
 pages.innerHTML=out.pages.slice(0,4).join('');
 pages.lastElementChild.classList.add('lock');
 pages.insertAdjacentHTML('beforeend',paywall(out,[0,1,2,3],'続きは完全版で'));
 stickyBar();
}
function freeView(){
 const b=(store.get('tw_birth')||'').split('-').map(Number);
 const go=(Y,M,D)=>{const out=buildReport(Y,M,D,'');if(!out){alert('1900年2月5日以降の日付を選んでください。');return}
  const t=TT[out.r.core].n;
  ui.innerHTML=`<div class="eyebrow">FREE ／ くわしい結果</div><h1>${t}タイプのあなたへ。<br>3つの自分と、伝え方のくわしい結果</h1><p>${Y}年${M}月${D}日生まれ。「あなたの組み合わせ」「ふだんの自分」「相手のタイプ別の伝え方」を無料でお見せします。</p>`;
  const ks=['combo','core','guide'];pages.innerHTML=ks.map(k=>out.byKey[k]).join('');
  pages.insertAdjacentHTML('beforeend',paywall(out,ks.map(k=>out.plan.findIndex(p=>p.key===k)),'ここまで無料'));stickyBar();};
 if(b.length===3&&b[0]){go(b[0],b[1],b[2]);return}
 ui.innerHTML=`<div class="eyebrow">FREE ／ くわしい結果</div><h1>生年月日を選んでください</h1><form id="ff"><select id="fy" aria-label="年"></select><select id="fm" aria-label="月"></select><select id="fd" aria-label="日"></select><button class="btn main" type="submit">見る</button></form>`;
 const G=i=>document.getElementById(i),yS=G('fy'),mS=G('fm'),dS=G('fd');
 for(let i=new Date().getFullYear();i>=1900;i--)yS.add(new Option(i+'年',i));for(let i=1;i<=12;i++)mS.add(new Option(i+'月',i));
 const fill=()=>{const k=+dS.value||1;const n=new Date(+yS.value,+mS.value,0).getDate();dS.innerHTML='';for(let i=1;i<=n;i++)dS.add(new Option(i+'日',i));dS.value=Math.min(k,n)};yS.value=1990;mS.value=1;fill();yS.onchange=fill;mS.onchange=fill;
 G('ff').onsubmit=e=>{e.preventDefault();store.set('tw_birth',`${yS.value}-${mS.value}-${dS.value}`);go(+yS.value,+mS.value,+dS.value)};
}
if(q.get('mode')==='free')freeView();
else if(paid)dateForm();
else if(q.get('sample')){ui.innerHTML=`<div class="eyebrow">SAMPLE</div><h1>見本：1990年1月23日生まれの場合</h1><div class="row"><a class="btn pink" href="${BUY_URL}">980円で自分のレポートを作る</a></div>`;render(1990,1,23,'')}
else salesView();
</script>
<footer class="noprint" style="text-align:center;padding:24px 16px 40px;font-size:12px"><a href="./law.html" style="color:#6b7280">特定商取引法に基づく表記</a></footer>
</body>
</html>
